<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warip Finance - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="admin-root"></div>
    <script type="module">
        import React from 'https://esm.sh/react';
        import ReactDOM from 'https://esm.sh/react-dom/client';
        import { useState, useEffect } from 'https://esm.sh/react';

        // ============================================
        // COMPOSANT PRINCIPAL ADMIN
        // ============================================
        const AdminApp = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [users, setUsers] = useState([]);
            const [selectedUser, setSelectedUser] = useState(null);
            const [adminComment, setAdminComment] = useState('');

            const API_URL = 'https://waripfinance.com';

            useEffect(() => {
                const token = localStorage.getItem('admin_token');
                const user = JSON.parse(localStorage.getItem('admin_user') || '{}');
                if (token && user.role === 'ADMIN') {
                    setIsLoggedIn(true);
                    fetchUsers(token);
                }
            }, []);

            const fetchUsers = async (token) => {
                try {
                    const res = await fetch(`${API_URL}/api/admin/users/pending`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    setUsers(data.users || []);
                } catch (error) {
                    console.error('Erreur:', error);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    const res = await fetch(`${API_URL}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        setError(data.error || 'Erreur de connexion');
                        setLoading(false);
                        return;
                    }

                    if (data.user.role !== 'ADMIN') {
                        setError('Accès refusé. Vous n\'êtes pas administrateur.');
                        setLoading(false);
                        return;
                    }

                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    setIsLoggedIn(true);
                    fetchUsers(data.token);

                } catch (err) {
                    setError('Erreur de connexion au serveur');
                } finally {
                    setLoading(false);
                }
            };

            const handleValidate = async (userId, status) => {
                try {
                    const token = localStorage.getItem('admin_token');
                    await fetch(`${API_URL}/api/admin/users/${userId}/validate`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ status, admin_comment: adminComment })
                    });
                    setAdminComment('');
                    setSelectedUser(null);
                    fetchUsers(token);
                } catch (error) {
                    console.error('Erreur validation:', error);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_user');
                setIsLoggedIn(false);
                setUsers([]);
            };

            // ==========================================
            // ÉCRAN DE CONNEXION ADMIN
            // ==========================================
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
                        <div className="bg-gray-800 p-8 rounded-2xl max-w-md w-full shadow-xl border border-gray-700">
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-3">👑</div>
                                <h1 className="text-3xl font-bold text-yellow-500">Accès Admin</h1>
                                <p className="text-gray-400 mt-2">Espace réservé au propriétaire</p>
                            </div>

                            {error && (
                                <div className="bg-red-900/50 border border-red-500 text-red-300 p-3 rounded-lg mb-4 text-sm">
                                    {error}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-gray-300 mb-2 text-sm font-medium">Email admin</label>
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="admin@waripfinance.com"
                                        className="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-gray-300 mb-2 text-sm font-medium">Mot de passe admin</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                                        required
                                    />
                                </div>

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className={`w-full py-3 rounded-lg font-semibold text-lg transition ${
                                        loading ? 'bg-gray-600 cursor-not-allowed' : 'bg-yellow-500 text-gray-900 hover:bg-yellow-400'
                                    }`}
                                >
                                    {loading ? '⏳ Connexion...' : '🔑 Se connecter'}
                                </button>
                            </form>

                            <p className="text-center text-gray-500 text-xs mt-6">
                                Accès réservé au propriétaire
                            </p>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // TABLEAU DE BORD ADMIN
            // ==========================================
            return (
                <div className="min-h-screen bg-gray-900 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                            <div>
                                <h1 className="text-3xl font-bold text-yellow-500">👑 Administration</h1>
                                <p className="text-gray-400">Gestion des utilisateurs inscrits</p>
                            </div>
                            <button
                                onClick={handleLogout}
                                className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm"
                            >
                                Déconnexion
                            </button>
                        </div>

                        <div className="bg-gray-800 p-4 rounded-2xl mb-6">
                            <p className="text-gray-400 text-sm">Utilisateurs en attente de validation</p>
                            <p className="text-3xl font-bold text-yellow-500">{users.length}</p>
                        </div>

                        {users.length === 0 ? (
                            <div className="text-center text-gray-400 bg-gray-800 p-12 rounded-2xl">
                                🎉 Aucun utilisateur en attente de validation
                            </div>
                        ) : (
                            <div className="bg-gray-800 rounded-2xl overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-gray-700">
                                            <tr>
                                                <th className="px-4 py-3 text-left text-gray-300">Nom</th>
                                                <th className="px-4 py-3 text-left text-gray-300">Email</th>
                                                <th className="px-4 py-3 text-left text-gray-300">Téléphone</th>
                                                <th className="px-4 py-3 text-left text-gray-300">Date</th>
                                                <th className="px-4 py-3 text-left text-gray-300">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {users.map((user) => (
                                                <tr key={user.id} className="border-t border-gray-700 hover:bg-gray-700/50">
                                                    <td className="px-4 py-3 text-white">{user.first_name} {user.last_name}</td>
                                                    <td className="px-4 py-3 text-gray-300">{user.email}</td>
                                                    <td className="px-4 py-3 text-gray-300">{user.phone}</td>
                                                    <td className="px-4 py-3 text-gray-400 text-sm">
                                                        {new Date(user.created_at).toLocaleDateString('fr-FR')}
                                                    </td>
                                                    <td className="px-4 py-3">
                                                        <button
                                                            onClick={() => setSelectedUser(user)}
                                                            className="px-3 py-1 bg-yellow-500/20 text-yellow-500 rounded-lg hover:bg-yellow-500/30 transition text-xs font-semibold"
                                                        >
                                                            🔍 Traiter
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="p-4 text-xs text-gray-500 border-t border-gray-700">
                                    Total : {users.length} utilisateur{users.length > 1 ? 's' : ''} en attente
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modal de validation */}
                    {selectedUser && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-800 rounded-2xl p-8 max-w-md w-full">
                                <h2 className="text-2xl font-bold text-yellow-500 mb-4">Traiter l'utilisateur</h2>

                                <div className="space-y-2 text-gray-300 mb-6 text-sm">
                                    <p><strong>Nom :</strong> {selectedUser.first_name} {selectedUser.last_name}</p>
                                    <p><strong>Email :</strong> {selectedUser.email}</p>
                                    <p><strong>Téléphone :</strong> {selectedUser.phone}</p>
                                    <p><strong>Inscription :</strong> {new Date(selectedUser.created_at).toLocaleDateString('fr-FR')}</p>
                                </div>

                                <div className="mb-4">
                                    <label className="block text-gray-300 mb-2 text-sm">Commentaire (optionnel)</label>
                                    <textarea
                                        value={adminComment}
                                        onChange={(e) => setAdminComment(e.target.value)}
                                        placeholder="Motif du rejet..."
                                        className="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500 resize-none"
                                        rows="3"
                                    />
                                </div>

                                <div className="flex flex-col sm:flex-row gap-3">
                                    <button
                                        onClick={() => handleValidate(selectedUser.id, 'ACTIVE')}
                                        className="flex-1 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold"
                                    >
                                        ✅ Valider
                                    </button>
                                    <button
                                        onClick={() => handleValidate(selectedUser.id, 'BLOCKED')}
                                        className="flex-1 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-semibold"
                                    >
                                        ❌ Rejeter
                                    </button>
                                </div>

                                <button
                                    onClick={() => {
                                        setSelectedUser(null);
                                        setAdminComment('');
                                    }}
                                    className="w-full mt-4 py-2 text-gray-400 hover:text-white transition text-sm"
                                >
                                    Annuler
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('admin-root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
