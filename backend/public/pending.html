<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte en attente - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 card-shadow text-center">
            <div class="text-6xl mb-4">⏳</div>
            <h1 class="text-2xl font-bold text-dark">Compte en attente de validation</h1>
            <p class="text-gray-600 mt-2 text-sm">
                Votre compte a bien été créé. Il est actuellement en attente de validation par notre équipe administrative.
            </p>
            <div class="mt-4 p-4 bg-yellow-50 rounded-lg text-yellow-700 text-sm">
                <i class="fas fa-clock mr-2"></i>
                Vous recevrez un email dès que votre compte sera validé.
            </div>
            <div class="mt-6">
                <a href="/" class="text-gold hover:underline text-sm">
                    <i class="fas fa-arrow-left mr-1"></i>Retour à l'accueil
                </a>
            </div>
        </div>
    </div>
</body>
</html>
