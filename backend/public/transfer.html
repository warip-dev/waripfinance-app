<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Virement - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f0f2f5; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; font-size: 14px; transition: all 0.3s; display: inline-block; text-align: center; text-decoration: none; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 182, 74, 0.3); }
        .gradient-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .input-focus:focus { border-color: #e9b64a; box-shadow: 0 0 0 3px rgba(233, 182, 74, 0.2); }
    </style>
</head>
<body>

    <header class="gradient-header fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="text-white font-bold text-xl"><span class="gold">Warip</span> Finance</a>
                <a href="/" class="text-white hover:text-gray-300"><i class="fas fa-arrow-left mr-2"></i>Retour</a>
            </div>
        </div>
    </header>

    <div class="pt-24 pb-8 px-4 md:px-8 max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl p-8 card-shadow">
            <h1 class="text-2xl font-bold text-dark mb-2">💸 Virement SEPA</h1>
            <p class="text-gray-500 text-sm mb-6">Sélectionnez un bénéficiaire validé.</p>

            <div id="message" class="text-sm mb-4"></div>

            <form id="transferForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bénéficiaire</label>
                    <select id="beneficiarySelect" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                        <option value="">-- Sélectionnez un bénéficiaire --</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Montant (EUR)</label>
                    <input type="number" id="amount" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required step="0.01" min="0.01">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Référence (optionnel)</label>
                    <input type="text" id="reference" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus">
                </div>
                <button type="submit" id="submitBtn" class="w-full btn-primary py-3 text-lg">
                    <i class="fas fa-paper-plane mr-2"></i>Envoyer le virement
                </button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        function loadBeneficiaries() {
            fetch('/api/beneficiaries', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('beneficiarySelect');
                const active = (data.beneficiaries || []).filter(b => b.status === 'ACTIVE');
                if (active.length === 0) {
                    select.innerHTML = '<option value="">-- Aucun bénéficiaire validé --</option>';
                } else {
                    select.innerHTML = '<option value="">-- Sélectionnez un bénéficiaire --</option>' +
                        active.map(b => `<option value="${b.id}">${b.name} - ${b.iban}</option>`).join('');
                }

                const params = new URLSearchParams(window.location.search);
                const beneficiaryId = params.get('beneficiary');
                if (beneficiaryId) {
                    select.value = beneficiaryId;
                }
            })
            .catch(() => {
                document.getElementById('beneficiarySelect').innerHTML = '<option value="">Erreur de chargement</option>';
            });
        }

        loadBeneficiaries();

        document.getElementById('transferForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            const beneficiaryId = document.getElementById('beneficiarySelect').value;
            const amount = document.getElementById('amount').value;
            const reference = document.getElementById('reference').value;

            if (!beneficiaryId) {
                msg.innerHTML = '<span class="text-red-500">Veuillez sélectionner un bénéficiaire.</span>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Envoi...';

            fetch('/api/transfers', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ beneficiary_id: beneficiaryId, amount, reference })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.innerHTML = '<span class="text-green-500">✅ Virement soumis avec succès, en attente de validation.</span>';
                    document.getElementById('transferForm').reset();
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    msg.innerHTML = '<span class="text-red-500">' + (data.error || 'Erreur') + '</span>';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Envoyer le virement';
                }
            })
            .catch(() => {
                msg.innerHTML = '<span class="text-red-500">Erreur de connexion au serveur</span>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Envoyer le virement';
            });
        });
    </script>
</body>
</html>
