<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f5f7fa; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 28px; border-radius: 12px; border: none; cursor: pointer; font-size: 14px; transition: all 0.3s; display: inline-block; text-align: center; text-decoration: none; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 182, 74, 0.25); }
        .btn-outline { background: transparent; color: #1a1a2e; border: 2px solid #e9b64a; font-weight: 600; padding: 10px 24px; border-radius: 12px; cursor: pointer; font-size: 14px; transition: all 0.3s; display: inline-block; text-align: center; text-decoration: none; }
        .btn-outline:hover { background: #e9b64a; color: #1a1a2e; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .gradient-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .balance-card { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%); border-radius: 20px; padding: 28px; }
        .action-card { background: white; border-radius: 16px; padding: 24px; transition: all 0.3s; border: 1px solid #edf2f7; cursor: pointer; }
        .action-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.06); border-color: #e9b64a; }
        .profile-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #e9b64a, #d4a03a); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #1a1a2e; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="gradient-header fixed w-full z-50 top-0">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="text-white font-bold text-xl"><span class="gold">Warip</span> Finance</a>
                <button id="logoutBtn" class="btn-danger px-4 py-1.5 text-sm">
                    <i class="fas fa-sign-out-alt mr-1"></i>Déconnexion
                </button>
            </div>
        </div>
    </header>

    <div class="pt-20 pb-8 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
        <div class="flex justify-between items-center mt-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-dark">Bonjour <span id="userFirstName" class="gold">Client</span></h1>
                <p class="text-gray-500 text-sm">Bienvenue sur votre espace client</p>
            </div>
            <a href="/deposit.html" class="btn-primary">
                <i class="fas fa-arrow-down mr-2"></i>Déposer
            </a>
        </div>

        <!-- Solde -->
        <div class="balance-card text-white mb-8">
            <div>
                <p class="text-gray-400 text-sm font-medium">Solde total</p>
                <p class="text-3xl md:text-4xl font-bold" id="userBalance">0,00 €</p>
                <div class="flex gap-6 mt-2 text-sm">
                    <span class="text-gray-400">BTC: <span class="text-white font-mono" id="btcBalance">0,0000</span></span>
                    <span class="text-gray-400">ETH: <span class="text-white font-mono" id="ethBalance">0,0000</span></span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
            <a href="/deposit.html" class="action-card text-center">
                <div class="text-3xl gold mb-3"><i class="fas fa-arrow-down"></i></div>
                <p class="font-semibold text-dark">Déposer</p>
                <p class="text-xs text-gray-400">BTC / ETH</p>
            </a>
            <div class="action-card text-center opacity-50 cursor-not-allowed">
                <div class="text-3xl gold mb-3"><i class="fas fa-arrow-up"></i></div>
                <p class="font-semibold text-dark">Retirer</p>
                <p class="text-xs text-gray-400">Bientôt</p>
            </div>
            <div class="action-card text-center opacity-50 cursor-not-allowed">
                <div class="text-3xl gold mb-3"><i class="fas fa-exchange-alt"></i></div>
                <p class="font-semibold text-dark">Échanger</p>
                <p class="text-xs text-gray-400">Bientôt</p>
            </div>
        </div>

        <!-- Bénéficiaires -->
        <div class="bg-white rounded-2xl p-6 card-shadow">
            <h3 class="font-semibold text-dark mb-4">Bénéficiaires</h3>
            <div id="beneficiariesList"><p class="text-gray-400 text-sm">Chargement...</p></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || !user.email) {
            window.location.href = '/';
        }

        document.getElementById('userFirstName').textContent = user.first_name || 'Client';
        document.getElementById('userBalance').textContent = (user.balance || 0).toFixed(2) + ' €';

        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Voulez-vous vous déconnecter ?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
            }
        });

        function loadBeneficiaries() {
            const list = document.getElementById('beneficiariesList');
            fetch('/api/beneficiaries', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                if (!data.beneficiaries || data.beneficiaries.length === 0) {
                    list.innerHTML = '<p class="text-gray-400 text-sm">Aucun bénéficiaire enregistré</p>';
                    return;
                }
                list.innerHTML = data.beneficiaries.slice(0, 3).map(b => `
                    <div class="flex justify-between items-center py-3 border-b border-gray-100 last:border-0">
                        <span class="text-dark">${b.name}</span>
                        <span class="text-xs ${b.status === 'ACTIVE' ? 'text-green-500' : b.status === 'REJECTED' ? 'text-red-500' : 'text-yellow-500'}">
                            ${b.status === 'ACTIVE' ? '✅ Validé' : b.status === 'REJECTED' ? '❌ Rejeté' : '⏳ En attente'}
                        </span>
                    </div>
                `).join('');
                if (data.beneficiaries.length > 3) {
                    list.innerHTML += `<p class="text-xs text-gray-400 mt-2">+ ${data.beneficiaries.length - 3} autres</p>`;
                }
            })
            .catch(() => { list.innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement</p>'; });
        }

        loadBeneficiaries();
    </script>
</body>
</html>
