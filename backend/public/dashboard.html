<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .btn-danger { background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-danger:hover { background: #dc2626; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gray-50 p-4 md:p-8">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-dark">🏦 Warip Finance</h1>
                <button id="logoutBtn" class="btn-danger"><i class="fas fa-sign-out-alt mr-2"></i>Déconnexion</button>
            </div>

            <div class="grid md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl card-shadow">
                    <p class="text-gray-500 text-sm">Solde</p>
                    <p class="text-3xl font-bold text-dark">0,00 €</p>
                </div>
                <div class="bg-white p-6 rounded-2xl card-shadow">
                    <p class="text-gray-500 text-sm">BTC</p>
                    <p class="text-3xl font-bold text-dark">0,0000</p>
                </div>
                <div class="bg-white p-6 rounded-2xl card-shadow">
                    <p class="text-gray-500 text-sm">ETH</p>
                    <p class="text-3xl font-bold text-dark">0,0000</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-8 card-shadow">
                <h2 class="text-xl font-bold text-dark mb-4">Bienvenue sur votre espace client</h2>
                <p class="text-gray-600">Vos transactions et opérations seront disponibles prochainement.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });

        // Vérifier si l'utilisateur est connecté
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!user.email) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
