<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-6xl mx-auto p-4">
        <div class="flex justify-between items-center py-4 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800">🏦 Warip Finance</h1>
            <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                Déconnexion
            </button>
        </div>

        <div class="mt-8">
            <h2 class="text-3xl font-bold text-gray-800">Bonjour <span id="userName" class="text-yellow-600">Client</span> 👋</h2>
            <p class="text-gray-500">Bienvenue sur votre espace client</p>
        </div>

        <div class="mt-8 bg-gradient-to-r from-gray-800 to-gray-900 text-white p-6 rounded-2xl">
            <p class="text-gray-400 text-sm">Solde total</p>
            <p class="text-3xl font-bold" id="balance">0,00 €</p>
            <div class="flex gap-6 mt-2 text-sm">
                <span class="text-gray-400">BTC: <span class="text-white" id="btc">0,0000</span></span>
                <span class="text-gray-400">ETH: <span class="text-white" id="eth">0,0000</span></span>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-2 md:grid-cols-3 gap-4">
            <a href="/deposit.html" class="bg-white p-6 rounded-2xl shadow text-center hover:shadow-lg transition">
                <div class="text-3xl mb-2">📥</div>
                <p class="font-semibold text-gray-800">Déposer</p>
            </a>
            <div class="bg-white p-6 rounded-2xl shadow text-center opacity-50 cursor-not-allowed">
                <div class="text-3xl mb-2">📤</div>
                <p class="font-semibold text-gray-800">Retirer</p>
                <p class="text-xs text-gray-400">Bientôt</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow text-center opacity-50 cursor-not-allowed">
                <div class="text-3xl mb-2">🔄</div>
                <p class="font-semibold text-gray-800">Échanger</p>
                <p class="text-xs text-gray-400">Bientôt</p>
            </div>
        </div>

        <div class="mt-8 bg-white p-6 rounded-2xl shadow">
            <h3 class="font-semibold text-gray-800 mb-4">Bénéficiaires</h3>
            <div id="beneficiaries"><p class="text-gray-400 text-sm">Chargement...</p></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || !user.email) {
            window.location.href = '/';
        }

        document.getElementById('userName').textContent = user.first_name || 'Client';
        document.getElementById('balance').textContent = (user.balance || 0).toFixed(2) + ' €';

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });

        function loadBeneficiaries() {
            const list = document.getElementById('beneficiaries');
            fetch('/api/beneficiaries', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                if (!data.beneficiaries || data.beneficiaries.length === 0) {
                    list.innerHTML = '<p class="text-gray-400 text-sm">Aucun bénéficiaire</p>';
                    return;
                }
                list.innerHTML = data.beneficiaries.slice(0, 3).map(b => `
                    <div class="flex justify-between py-2 border-b border-gray-100">
                        <span class="text-gray-800">${b.name}</span>
                        <span class="text-xs ${b.status === 'ACTIVE' ? 'text-green-500' : 'text-yellow-500'}">
                            ${b.status === 'ACTIVE' ? '✅ Validé' : '⏳ En attente'}
                        </span>
                    </div>
                `).join('');
            })
            .catch(() => { list.innerHTML = '<p class="text-red-500 text-sm">Erreur</p>'; });
        }

        loadBeneficiaries();
    </script>

</body>
</html>
