<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warip Finance - Créer un compte</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-container {
            background: white;
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #eef1f5;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #1e2a3a;
            text-align: center;
            margin-bottom: 8px;
        }
        .logo span {
            background: #ffd600;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .subtitle {
            text-align: center;
            color: #7a869a;
            font-size: 15px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1e2a3a;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eef1f5;
            border-radius: 60px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            transition: border 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #ffd600;
            background: white;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-register {
            width: 100%;
            padding: 16px;
            background: #ffd600;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            color: #1e2a3a;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-register:hover {
            background: #f5c800;
        }
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #7a869a;
        }
        .login-link a {
            color: #1e2a3a;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #fff5f5;
            color: #e74c3c;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .success-message {
            background: #e8f8f6;
            color: #00b8a9;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .password-requirements {
            font-size: 12px;
            color: #7a869a;
            margin-top: 4px;
            padding-left: 4px;
        }
        .password-requirements.valid {
            color: #00b8a9;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo"><span>W</span>arip Finance</div>
        <div class="subtitle">Créez votre compte en quelques secondes</div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Prénom</label>
                    <input type="text" id="firstName" placeholder="Jean" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Nom</label>
                    <input type="text" id="lastName" placeholder="Dupont" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="jean.dupont@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Téléphone</label>
                <input type="tel" id="phone" placeholder="06 12 34 56 78">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" minlength="6" required>
                <div class="password-requirements" id="passwordHint">Minimum 6 caractères</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">Créer mon compte</button>
        </form>

        <div class="login-link">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
    </div>

    <script>
        // Vérification du mot de passe en temps réel
        document.getElementById('password').addEventListener('input', function() {
            const hint = document.getElementById('passwordHint');
            if (this.value.length >= 6) {
                hint.textContent = '✅ Mot de passe valide';
                hint.className = 'password-requirements valid';
            } else {
                hint.textContent = 'Minimum 6 caractères';
                hint.className = 'password-requirements';
            }
        });

        async function handleRegister(event) {
            event.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const btn = document.getElementById('registerBtn');

            // Cacher les messages précédents
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // Validation
            if (password !== confirmPassword) {
                errorDiv.textContent = '❌ Les mots de passe ne correspondent pas';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = '❌ Le mot de passe doit faire au moins 6 caractères';
                errorDiv.style.display = 'block';
                return;
            }

            // Désactiver le bouton
            btn.disabled = true;
            btn.textContent = '⏳ Création en cours...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        firstName,
                        lastName,
                        email,
                        phone,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = '✅ ' + data.message + ' Redirection...';
                    successDiv.style.display = 'block';

                    // Stocker le token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Rediriger vers le dashboard après 1.5s
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    errorDiv.textContent = '❌ ' + data.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Créer mon compte';
                }

            } catch (error) {
                console.error('Erreur:', error);
                errorDiv.textContent = '❌ Erreur de connexion au serveur';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Créer mon compte';
            }
        }
    </script>

</body>
</html>
