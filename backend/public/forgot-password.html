<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mot de passe oublié - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .hover-bg-gold:hover { background: #d4a03a; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .input-focus:focus { border-color: #e9b64a; box-shadow: 0 0 0 3px rgba(233, 182, 74, 0.2); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 28px; border-radius: 8px; transition: all 0.3s; border: none; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-8 card-shadow">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-dark">🔑 Mot de passe oublié</h1>
            <p class="text-gray-500 text-sm mt-2">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
        </div>

        <div id="message" class="text-sm mb-4"></div>

        <form id="forgot-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" placeholder="exemple@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full btn-primary py-3 text-lg">
                <i class="fas fa-paper-plane mr-2"></i>Envoyer le lien
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gold hover:underline"><i class="fas fa-arrow-left mr-1"></i>Retour à l'accueil</a>
        </div>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const message = document.getElementById('message');
            const btn = document.getElementById('submit-btn');

            message.innerHTML = '';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Envoi...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    message.innerHTML = `<span class="text-green-500">✅ ${data.message}</span>`;
                    document.getElementById('email').value = '';
                } else {
                    message.innerHTML = `<span class="text-red-500">❌ ${data.error || 'Erreur'}</span>`;
                }
            } catch (err) {
                message.innerHTML = `<span class="text-red-500">❌ Erreur de connexion au serveur</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Envoyer le lien';
            }
        });
    </script>
</body>
</html>
