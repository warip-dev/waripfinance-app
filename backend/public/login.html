<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warip Finance - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #eef1f5;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #1e2a3a;
            text-align: center;
            margin-bottom: 8px;
        }
        .logo span {
            background: #ffd600;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .subtitle {
            text-align: center;
            color: #7a869a;
            font-size: 15px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1e2a3a;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eef1f5;
            border-radius: 60px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            transition: border 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #ffd600;
            background: white;
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: #ffd600;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            color: #1e2a3a;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: #f5c800;
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #7a869a;
        }
        .register-link a {
            color: #1e2a3a;
            font-weight: 600;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #fff5f5;
            color: #e74c3c;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .success-message {
            background: #e8f8f6;
            color: #00b8a9;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .forgot-password {
            text-align: right;
            font-size: 13px;
            color: #7a869a;
            margin-top: -10px;
            margin-bottom: 16px;
        }
        .forgot-password a {
            color: #7a869a;
            text-decoration: none;
        }
        .forgot-password a:hover {
            color: #1e2a3a;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo"><span>W</span>arip Finance</div>
        <div class="subtitle">Connectez-vous à votre espace</div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="jean.dupont@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="forgot-password">
                <a href="#">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Se connecter</button>
        </form>

        <div class="register-link">
            Pas encore de compte ? <a href="register.html">Créer un compte</a>
        </div>
    </div>

    <script>
        // Vérifier si déjà connecté
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const btn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            btn.disabled = true;
            btn.textContent = '⏳ Connexion...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = '✅ ' + data.message + ' Redirection...';
                    successDiv.style.display = 'block';

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    errorDiv.textContent = '❌ ' + data.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Se connecter';
                }

            } catch (error) {
                console.error('Erreur:', error);
                errorDiv.textContent = '❌ Erreur de connexion au serveur';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        }
    </script>

</body>
</html>
