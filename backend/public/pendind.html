<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warip Finance - Compte en attente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .pending-container {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 50px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #eef1f5;
            text-align: center;
        }
        .logo { font-size: 28px; font-weight: 800; color: #1e2a3a; }
        .logo span { background: #ffd600; padding: 2px 12px; border-radius: 30px; }
        .icon { font-size: 72px; margin: 24px 0; display: block; }
        h1 { font-size: 24px; color: #1e2a3a; margin-bottom: 12px; }
        p { color: #7a869a; font-size: 15px; line-height: 1.7; margin-bottom: 8px; }
        .highlight { color: #00b8a9; font-weight: 600; }
        .btn-home {
            display: inline-block;
            padding: 14px 40px;
            background: #ffd600;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            color: #1e2a3a;
            cursor: pointer;
            text-decoration: none;
            margin-top: 24px;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .btn-home:hover { background: #f5c800; }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #eef1f5;
            border-top-color: #ffd600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="pending-container">
        <div class="logo"><span>W</span>arip Finance</div>
        <div class="loader"></div>
        <span class="icon">✅</span>
        <h1>Compte créé avec succès !</h1>
        <p>
            Votre compte a été créé et est en cours de validation par notre équipe.
        </p>
        <p>
            Vous recevrez un <span class="highlight">email de confirmation</span> 
            après validation de votre compte.
        </p>
        <p style="font-size: 13px; color: #aab3c5; margin-top: 12px;">
            ⏳ Temps d'attente estimé : 24 à 48 heures
        </p>
        <a href="login.html" class="btn-home">Retour à la connexion</a>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = 'dashboard.html';
        }
    </script>

</body>
</html>
