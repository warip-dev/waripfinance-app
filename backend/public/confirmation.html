<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription confirmée - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 28px; border-radius: 8px; transition: all 0.3s; border: none; cursor: pointer; display: inline-block; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-8 md:p-12 card-shadow text-center">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check text-4xl text-green-500"></i>
            </div>

            <h1 class="text-3xl font-bold text-dark">✅ Compte créé avec succès</h1>
            <p class="text-gray-500 mt-2">Bienvenue chez <span class="gold font-semibold">Warip Finance</span></p>

            <div class="mt-6 bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-left">
                <div class="flex items-start gap-4">
                    <i class="fas fa-clock text-yellow-500 text-2xl mt-1"></i>
                    <div>
                        <h3 class="font-semibold text-dark">Compte en attente de validation</h3>
                        <p class="text-gray-600 text-sm mt-1">
                            Notre équipe vérifie vos informations. Vous recevrez un email dès que votre compte sera activé.
                        </p>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="btn-primary"><i class="fas fa-home mr-2"></i>Retour à l'accueil</a>
            </div>

            <p class="text-gray-400 text-xs mt-6">
                Un email de confirmation vous a été envoyé.
            </p>
        </div>
    </div>
</body>
</html>
