<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #111827; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .hover-bg-gold:hover { background: #d4a03a; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-2xl max-w-md w-full">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold gold">🔐 Nouveau mot de passe</h1>
                <p class="text-gray-400 mt-2">Saisissez votre nouveau mot de passe ci-dessous.</p>
            </div>

            <div id="message" class="text-sm mb-4"></div>

            <form id="reset-form" class="space-y-4">
                <input type="password" id="newPassword" placeholder="Nouveau mot de passe (min 8 caractères)" class="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500" required minlength="8">
                <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" class="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500" required>

                <button type="submit" id="submit-btn" class="w-full py-3 rounded-lg font-semibold text-lg transition bg-gold text-gray-900 hover-bg-gold">
                    🔑 Réinitialiser
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/" class="text-gray-400 hover:text-yellow-500 text-sm transition">← Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script>
        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            const btn = document.getElementById('submit-btn');

            message.innerHTML = '';

            if (newPassword !== confirmPassword) {
                message.innerHTML = `<span style="color: #f87171;">❌ Les mots de passe ne correspondent pas</span>`;
                return;
            }

            if (newPassword.length < 8) {
                message.innerHTML = `<span style="color: #f87171;">❌ Le mot de passe doit contenir au moins 8 caractères</span>`;
                return;
            }

            btn.textContent = '⏳ Réinitialisation...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword, confirmPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    message.innerHTML = `<span style="color: #34d399;">✅ ${data.message}</span>`;
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else {
                    message.innerHTML = `<span style="color: #f87171;">❌ ${data.error || 'Erreur'}</span>`;
                }
            } catch (err) {
                message.innerHTML = `<span style="color: #f87171;">❌ Erreur de connexion au serveur</span>`;
            } finally {
                btn.textContent = '🔑 Réinitialiser';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
