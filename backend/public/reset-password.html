<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialisation - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-primary:hover { background: #d4a03a; }
        .input-focus:focus { border-color: #e9b64a; box-shadow: 0 0 0 3px rgba(233, 182, 74, 0.2); }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-8 card-shadow">
        <h1 class="text-3xl font-bold text-dark text-center">🔐 Nouveau mot de passe</h1>
        <p class="text-gray-500 text-sm text-center mt-2">Saisissez votre nouveau mot de passe.</p>
        <div id="message" class="text-sm mb-4"></div>
        <form id="reset-form">
            <div class="mb-4">
                <input type="password" id="newPassword" placeholder="Nouveau mot de passe (min 8)" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required minlength="8">
            </div>
            <div class="mb-4">
                <input type="password" id="confirmPassword" placeholder="Confirmer" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full btn-primary py-3 text-lg"><i class="fas fa-key mr-2"></i>Réinitialiser</button>
        </form>
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gold hover:underline"><i class="fas fa-arrow-left mr-1"></i>Retour</a>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            const btn = document.getElementById('submit-btn');
            message.innerHTML = '';
            if (newPassword !== confirmPassword) {
                message.innerHTML = `<span class="text-red-500">❌ Les mots de passe ne correspondent pas</span>`;
                return;
            }
            if (newPassword.length < 8) {
                message.innerHTML = `<span class="text-red-500">❌ 8 caractères minimum</span>`;
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Réinitialisation...';
            try {
                const res = await fetch('https://waripfinance.com/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword, confirmPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    message.innerHTML = `<span class="text-green-500">✅ ${data.message}</span>`;
                    setTimeout(() => { window.location.href = '/'; }, 3000);
                } else {
                    message.innerHTML = `<span class="text-red-500">❌ ${data.error || 'Erreur'}</span>`;
                }
            } catch (err) {
                message.innerHTML = `<span class="text-red-500">❌ Erreur de connexion au serveur</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key mr-2"></i>Réinitialiser';
            }
        });
    </script>
</body>
</html>
