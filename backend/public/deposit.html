<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Déposer - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-2xl mx-auto p-4 pt-8">
        <a href="/dashboard.html" class="text-gray-500 hover:text-gray-700 mb-4 inline-block">← Retour</a>

        <div class="bg-white p-8 rounded-2xl shadow">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">📥 Déposer</h1>
            <p class="text-gray-500 text-sm mb-6">Utilisez les adresses ci-dessous.</p>

            <div id="addresses">
                <div class="border border-gray-200 rounded-xl p-4 mb-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-bold">₿ Bitcoin</span>
                        <button onclick="copyAddress('btc')" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700">Copier</button>
                    </div>
                    <p id="btcAddress" class="text-gray-600 text-sm font-mono mt-2 break-all bg-gray-50 p-2 rounded">Chargement...</p>
                    <p class="text-xs text-gray-400 mt-1">Réseau Bitcoin</p>
                </div>

                <div class="border border-gray-200 rounded-xl p-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-bold">⟠ Ethereum</span>
                        <button onclick="copyAddress('eth')" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700">Copier</button>
                    </div>
                    <p id="ethAddress" class="text-gray-600 text-sm font-mono mt-2 break-all bg-gray-50 p-2 rounded">Chargement...</p>
                    <p class="text-xs text-gray-400 mt-1">Réseau ERC20</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        function copyAddress(type) {
            const el = type === 'btc' ? document.getElementById('btcAddress') : document.getElementById('ethAddress');
            if (el.textContent && el.textContent !== 'Chargement...') {
                navigator.clipboard.writeText(el.textContent);
                alert('✅ Adresse copiée !');
            }
        }

        fetch('/api/admin/deposit-addresses', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.json())
        .then(data => {
            if (data.addresses) {
                const btc = data.addresses.find(a => a.currency === 'BTC');
                const eth = data.addresses.find(a => a.currency === 'ETH');
                document.getElementById('btcAddress').textContent = btc ? btc.address : 'Non configurée';
                document.getElementById('ethAddress').textContent = eth ? eth.address : 'Non configurée';
            }
        })
        .catch(() => {
            document.getElementById('btcAddress').textContent = 'Erreur';
            document.getElementById('ethAddress').textContent = 'Erreur';
        });
    </script>

</body>
</html>
