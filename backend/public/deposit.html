<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Déposer - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f0f2f5; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; font-size: 14px; transition: all 0.3s; display: inline-block; text-align: center; text-decoration: none; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 182, 74, 0.3); }
        .gradient-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .copy-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; transition: all 0.3s; }
        .copy-btn:hover { background: rgba(255,255,255,0.15); }
        .deposit-address-box { background: #f8fafc; border: 1px dashed #d1d5db; border-radius: 12px; padding: 16px; transition: all 0.3s; }
        .deposit-address-box:hover { border-color: #e9b64a; background: #fefcf5; }
    </style>
</head>
<body>

    <header class="gradient-header fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="text-white font-bold text-xl"><span class="gold">Warip</span> Finance</a>
                <a href="/" class="text-white hover:text-gray-300"><i class="fas fa-arrow-left mr-2"></i>Retour</a>
            </div>
        </div>
    </header>

    <div class="pt-24 pb-8 px-4 md:px-8 max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl p-8 card-shadow">
            <h1 class="text-2xl font-bold text-dark mb-2">📥 Déposer des cryptos</h1>
            <p class="text-gray-500 text-sm mb-6">Utilisez les adresses ci-dessous pour déposer vos cryptomonnaies.</p>

            <div id="depositAddresses">
                <div class="deposit-address-box mb-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-2xl">₿</span>
                            <span class="font-semibold text-dark ml-2">Bitcoin</span>
                            <p class="text-xs text-gray-400">Réseau Bitcoin</p>
                        </div>
                        <button onclick="copyAddress('btc')" class="btn-primary px-4 py-2 text-sm" style="background: #1a1a2e; color: white;">
                            <i class="fas fa-copy mr-1"></i>Copier
                        </button>
                    </div>
                    <p id="btcAddress" class="text-gray-600 text-sm font-mono mt-2 break-all bg-gray-50 p-3 rounded-lg">Chargement...</p>
                </div>
                <div class="deposit-address-box">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-2xl">⟠</span>
                            <span class="font-semibold text-dark ml-2">Ethereum</span>
                            <p class="text-xs text-gray-400">Réseau ERC20</p>
                        </div>
                        <button onclick="copyAddress('eth')" class="btn-primary px-4 py-2 text-sm" style="background: #1a1a2e; color: white;">
                            <i class="fas fa-copy mr-1"></i>Copier
                        </button>
                    </div>
                    <p id="ethAddress" class="text-gray-600 text-sm font-mono mt-2 break-all bg-gray-50 p-3 rounded-lg">Chargement...</p>
                </div>
            </div>

            <div class="mt-6 p-4 bg-yellow-50 rounded-xl text-xs text-yellow-700">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                Envoyez uniquement les cryptos correspondantes sur ces adresses. Toute autre transaction sera perdue.
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        function copyAddress(type) {
            const el = type === 'btc' ? document.getElementById('btcAddress') : document.getElementById('ethAddress');
            if (el.textContent && el.textContent !== 'Chargement...' && el.textContent !== 'Non configurée') {
                navigator.clipboard.writeText(el.textContent);
                alert('✅ Adresse copiée !');
            } else {
                alert('❌ Adresse non disponible');
            }
        }

        function loadDepositAddresses() {
            fetch('/api/admin/deposit-addresses', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                if (!data.addresses) return;
                const btc = data.addresses.find(a => a.currency === 'BTC');
                const eth = data.addresses.find(a => a.currency === 'ETH');
                document.getElementById('btcAddress').textContent = btc ? btc.address : 'Non configurée';
                document.getElementById('ethAddress').textContent = eth ? eth.address : 'Non configurée';
            })
            .catch(() => {
                document.getElementById('btcAddress').textContent = 'Erreur de chargement';
                document.getElementById('ethAddress').textContent = 'Erreur de chargement';
            });
        }

        loadDepositAddresses();
    </script>
</body>
</html>
