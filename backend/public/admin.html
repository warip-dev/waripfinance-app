<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .btn-success { background: #22c55e; color: white; padding: 6px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; transition: all 0.3s; }
        .btn-success:hover { background: #16a34a; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; padding: 6px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; transition: all 0.3s; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 182, 74, 0.25); }
        .gradient-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .status-pending { background: #fef9c3; color: #854d0e; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-active { background: #dcfce7; color: #166534; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-rejected { background: #fee2e2; color: #991b1b; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #e9b64a; border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-btn { flex: 1; padding: 12px 16px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 500; transition: all 0.3s; cursor: pointer; border: none; background: transparent; color: #6b7280; }
        .tab-btn:hover { background: #f3f4f6; }
        .tab-btn.active { background: #e9b64a; color: #1a1a2e; font-weight: 600; }
    </style>
</head>
<body>

    <header class="gradient-header fixed w-full z-50 top-0">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <span class="text-white font-bold text-xl"><span class="gold">Warip</span> Finance <span class="text-gray-400 text-sm ml-2">Admin</span></span>
                <button id="adminLogout" class="bg-red-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-red-700 transition">
                    <i class="fas fa-sign-out-alt mr-1"></i>Déconnexion
                </button>
            </div>
        </div>
    </header>

    <div class="pt-20 pb-8 px-4 md:px-8 max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-dark mb-6">👑 Administration</h1>

        <div class="flex gap-2 mb-6 bg-white rounded-xl p-1 card-shadow">
            <button class="tab-btn active" data-tab="users">Utilisateurs</button>
            <button class="tab-btn" data-tab="addresses">Adresses</button>
        </div>

        <!-- Utilisateurs -->
        <div id="usersContent">
            <div class="bg-white rounded-2xl p-6 card-shadow">
                <h3 class="font-semibold text-dark mb-4">👥 Utilisateurs inscrits</h3>
                <div id="usersList"><div class="loading-spinner"></div></div>
            </div>
        </div>

        <!-- Adresses -->
        <div id="addressesContent" class="hidden">
            <div class="bg-white rounded-2xl p-6 card-shadow">
                <h3 class="font-semibold text-dark mb-4">🔑 Adresses de dépôt</h3>
                <div id="addressesList"><div class="loading-spinner"></div></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('admin_token');
        const user = JSON.parse(localStorage.getItem('admin_user') || '{}');

        if (!token || user.role !== 'ADMIN') {
            window.location.href = '/';
        }

        document.getElementById('adminLogout').addEventListener('click', function() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = '/';
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const target = this.dataset.tab;
                document.getElementById('usersContent').classList.toggle('hidden', target !== 'users');
                document.getElementById('addressesContent').classList.toggle('hidden', target !== 'addresses');
                if (target === 'users') loadUsers();
                if (target === 'addresses') loadAddresses();
            });
        });

        function apiCall(url, options = {}) {
            const token = localStorage.getItem('admin_token');
            return fetch(url, {
                ...options,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            }).then(res => res.json());
        }

        function loadUsers() {
            const list = document.getElementById('usersList');
            list.innerHTML = '<div class="loading-spinner"></div>';

            apiCall('/api/admin/users')
                .then(data => {
                    if (!data.users || data.users.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">Aucun utilisateur inscrit.</p>';
                        return;
                    }
                    list.innerHTML = data.users.map(u => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl mb-3">
                            <div>
                                <p class="font-semibold text-dark">${u.first_name} ${u.last_name}</p>
                                <p class="text-sm text-gray-500">${u.email}</p>
                                <p class="text-xs text-gray-400">Solde: ${u.balance || 0} €</p>
                                <span class="${u.status === 'PENDING' ? 'status-pending' : u.status === 'ACTIVE' ? 'status-active' : 'status-rejected'}">
                                    ${u.status === 'PENDING' ? '⏳ En attente' : u.status === 'ACTIVE' ? '✅ Actif' : '❌ Bloqué'}
                                </span>
                            </div>
                            <div>
                                ${u.status === 'PENDING' ? `
                                    <button onclick="validateUser('${u.id}', 'ACTIVE')" class="btn-success px-3 py-1 text-xs mr-1">
                                        <i class="fas fa-check"></i> Valider
                                    </button>
                                    <button onclick="validateUser('${u.id}', 'BLOCKED')" class="btn-danger px-3 py-1 text-xs">
                                        <i class="fas fa-times"></i> Rejeter
                                    </button>
                                ` : '<span class="text-xs text-gray-400">Déjà traité</span>'}
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = `<p class="text-red-500 text-sm">❌ Erreur: ${err.message}</p>`;
                    console.error(err);
                });
        }

        window.validateUser = function(id, status) {
            if (!confirm(`Voulez-vous vraiment ${status === 'ACTIVE' ? 'valider' : 'rejeter'} cet utilisateur ?`)) return;

            const btns = document.querySelectorAll(`button[onclick*="validateUser('${id}', '${status}')"]`);
            btns.forEach(btn => { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; });

            apiCall(`/api/admin/users/${id}/validate`, {
                method: 'PUT',
                body: JSON.stringify({ status })
            })
            .then(data => {
                if (data.success) {
                    alert(`✅ Utilisateur ${status === 'ACTIVE' ? 'validé' : 'rejeté'} avec succès !`);
                    loadUsers();
                } else {
                    alert(`❌ Erreur: ${data.error || 'Problème lors de la validation'}`);
                    btns.forEach(btn => {
                        btn.disabled = false;
                        btn.innerHTML = status === 'ACTIVE' ? '<i class="fas fa-check"></i> Valider' : '<i class="fas fa-times"></i> Rejeter';
                    });
                }
            })
            .catch(err => {
                alert(`❌ Erreur de connexion au serveur: ${err.message}`);
                btns.forEach(btn => {
                    btn.disabled = false;
                    btn.innerHTML = status === 'ACTIVE' ? '<i class="fas fa-check"></i> Valider' : '<i class="fas fa-times"></i> Rejeter';
                });
                console.error(err);
            });
        };

        function loadAddresses() {
            const list = document.getElementById('addressesList');
            list.innerHTML = '<div class="loading-spinner"></div>';

            apiCall('/api/admin/deposit-addresses')
                .then(data => {
                    if (!data.addresses || data.addresses.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">Aucune adresse configurée.</p>';
                        return;
                    }
                    list.innerHTML = data.addresses.map(a => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl mb-3">
                            <div>
                                <p class="font-semibold text-dark">${a.currency}</p>
                                <p class="text-sm text-gray-500 font-mono">${a.address}</p>
                                <p class="text-xs text-gray-400">Réseau: ${a.network}</p>
                            </div>
                            <button onclick="editAddress('${a.id}')" class="btn-primary px-3 py-1 text-xs">
                                <i class="fas fa-edit"></i> Modifier
                            </button>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = `<p class="text-red-500 text-sm">❌ Erreur: ${err.message}</p>`;
                    console.error(err);
                });
        }

        window.editAddress = function(id) {
            const newAddress = prompt('Entrez la nouvelle adresse:');
            if (!newAddress) return;
            apiCall(`/api/admin/deposit-addresses/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ address: newAddress })
            })
            .then(() => loadAddresses())
            .catch(err => alert(`Erreur: ${err.message}`));
        };

        loadUsers();
    </script>
</body>
</html>
