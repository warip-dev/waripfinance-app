<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body { background: #f0f2f5; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 182, 74, 0.3); }
        .btn-danger { background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-success { background: #22c55e; color: white; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .btn-success:hover { background: #16a34a; transform: translateY(-2px); }
        .btn-warning { background: #f59e0b; color: white; padding: 6px 14px; border-radius: 50px; border: none; cursor: pointer; font-size: 12px; transition: all 0.3s; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        .gradient-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .input-focus:focus { border-color: #e9b64a; box-shadow: 0 0 0 3px rgba(233, 182, 74, 0.2); }
        .status-pending { background: #fef9c3; color: #854d0e; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-active { background: #dcfce7; color: #166534; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-rejected { background: #fee2e2; color: #991b1b; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #e9b64a; border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .error-message { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; border: 1px solid #fecaca; margin-bottom: 16px; font-size: 14px; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>

    <!-- ADMIN LOGIN -->
    <div id="adminLoginPage" class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 card-shadow">
            <div class="text-center mb-8">
                <div class="text-5xl mb-3">👑</div>
                <h1 class="text-3xl font-bold text-dark">Administration</h1>
                <p class="text-gray-500 text-sm mt-2">Espace réservé aux administrateurs</p>
            </div>
            <div id="adminLoginError" class="hidden error-message"></div>
            <form id="adminLoginForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="adminEmail" placeholder="admin@waripfinance.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                </div>
                <button type="submit" class="w-full btn-primary py-3 text-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Se connecter
                </button>
            </form>
            <div class="text-center mt-6">
                <a href="/" class="text-sm text-gold hover:underline"><i class="fas fa-arrow-left mr-1"></i>Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboardPage" class="hidden">
        <header class="gradient-header fixed w-full z-50 top-0">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <span class="text-white font-bold text-xl"><span class="gold">Warip</span> Finance <span class="text-gray-400 text-sm ml-2">Admin</span></span>
                    <div class="flex items-center gap-3">
                        <span class="text-gray-300 text-sm hidden md:block" id="adminName">Admin</span>
                        <button id="adminLogout" class="btn-danger px-4 py-1.5 text-sm">
                            <i class="fas fa-sign-out-alt mr-1"></i>Déconnexion
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div id="adminContent" class="pt-20 pb-8 px-4 md:px-8 max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-dark mb-6">👑 Administration</h1>

            <div class="flex gap-2 mb-6 bg-white rounded-2xl p-1 card-shadow flex-wrap">
                <button id="tabUsers" class="tab-btn flex-1 py-3 px-4 rounded-xl text-sm font-medium transition bg-gold text-dark">Utilisateurs</button>
                <button id="tabBeneficiaries" class="tab-btn flex-1 py-3 px-4 rounded-xl text-sm font-medium transition text-gray-500 hover:bg-gray-50">Bénéficiaires</button>
                <button id="tabTransfers" class="tab-btn flex-1 py-3 px-4 rounded-xl text-sm font-medium transition text-gray-500 hover:bg-gray-50">Virements</button>
                <button id="tabAddresses" class="tab-btn flex-1 py-3 px-4 rounded-xl text-sm font-medium transition text-gray-500 hover:bg-gray-50">Adresses</button>
            </div>

            <div id="usersContent">
                <div class="bg-white rounded-2xl p-6 card-shadow">
                    <h3 class="font-semibold text-dark mb-4">👥 Utilisateurs inscrits</h3>
                    <div id="usersList"><div class="loading-spinner"></div></div>
                </div>
            </div>
            <div id="beneficiariesContent" class="hidden">
                <div class="bg-white rounded-2xl p-6 card-shadow">
                    <h3 class="font-semibold text-dark mb-4">📋 Bénéficiaires</h3>
                    <div id="adminBeneficiariesList"><div class="loading-spinner"></div></div>
                </div>
            </div>
            <div id="transfersContent" class="hidden">
                <div class="bg-white rounded-2xl p-6 card-shadow">
                    <h3 class="font-semibold text-dark mb-4">💸 Virements en attente</h3>
                    <div id="adminTransfersList"><div class="loading-spinner"></div></div>
                </div>
            </div>
            <div id="addressesContent" class="hidden">
                <div class="bg-white rounded-2xl p-6 card-shadow">
                    <h3 class="font-semibold text-dark mb-4">🔑 Adresses de dépôt</h3>
                    <div id="addressesList"><div class="loading-spinner"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GESTION ADMIN
        // ============================================
        (function() {
            const token = localStorage.getItem('admin_token');
            const user = JSON.parse(localStorage.getItem('admin_user') || '{}');

            if (token && user.role === 'ADMIN') {
                document.getElementById('adminLoginPage').classList.add('hidden');
                document.getElementById('adminDashboardPage').classList.remove('hidden');
                document.getElementById('adminName').textContent = user.first_name || 'Admin';
                initApp();
                return;
            }

            document.getElementById('adminLoginPage').classList.remove('hidden');
            document.getElementById('adminDashboardPage').classList.add('hidden');

            document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;
                const errorEl = document.getElementById('adminLoginError');
                errorEl.classList.add('hidden');
                errorEl.textContent = '';

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok || data.user?.role !== 'ADMIN') {
                        errorEl.textContent = data.error || 'Accès refusé. Vous n\'êtes pas administrateur.';
                        errorEl.classList.remove('hidden');
                        return;
                    }

                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    window.location.reload();
                } catch (err) {
                    errorEl.textContent = 'Erreur de connexion au serveur';
                    errorEl.classList.remove('hidden');
                }
            });
        })();

        // ============================================
        // INIT APP
        // ============================================
        function initApp() {
            setupTabs();
            loadUsers();

            document.getElementById('adminLogout').addEventListener('click', function() {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_user');
                window.location.reload();
            });
        }

        // ============================================
        // TABS
        // ============================================
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = {
                'tabUsers': 'usersContent',
                'tabBeneficiaries': 'beneficiariesContent',
                'tabTransfers': 'transfersContent',
                'tabAddresses': 'addressesContent'
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    Object.values(contents).forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.add('hidden');
                    });
                    const contentId = contents[this.id];
                    if (contentId) {
                        const el = document.getElementById(contentId);
                        if (el) el.classList.remove('hidden');
                    }
                    tabs.forEach(b => {
                        b.className = 'flex-1 py-3 px-4 rounded-xl text-sm font-medium transition text-gray-500 hover:bg-gray-50';
                    });
                    this.className = 'flex-1 py-3 px-4 rounded-xl text-sm font-medium transition bg-gold text-dark';

                    if (this.id === 'tabUsers') loadUsers();
                    else if (this.id === 'tabBeneficiaries') loadAdminBeneficiaries();
                    else if (this.id === 'tabTransfers') loadAdminTransfers();
                    else if (this.id === 'tabAddresses') loadAddresses();
                });
            });
        }

        // ============================================
        // FONCTION APPEL API
        // ============================================
        function apiCall(url, options = {}) {
            const token = localStorage.getItem('admin_token');
            const defaultOptions = {
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            };
            const mergedOptions = { ...defaultOptions, ...options };
            return fetch(url, mergedOptions).then(res => res.json());
        }

        // ============================================
        // UTILISATEURS - AVEC BOUTONS FONCTIONNELS
        // ============================================
        function loadUsers() {
            const list = document.getElementById('usersList');
            list.innerHTML = '<div class="loading-spinner"></div>';

            apiCall('/api/admin/users')
                .then(data => {
                    if (!data.users || data.users.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">Aucun utilisateur inscrit.</p>';
                        return;
                    }
                    list.innerHTML = data.users.map(u => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl">
                            <div>
                                <p class="font-semibold text-dark">${u.first_name} ${u.last_name}</p>
                                <p class="text-sm text-gray-500">${u.email}</p>
                                <p class="text-xs text-gray-400">Solde: ${u.balance || 0} €</p>
                                <span class="${u.status === 'PENDING' ? 'status-pending' : u.status === 'ACTIVE' ? 'status-active' : 'status-rejected'}">
                                    ${u.status === 'PENDING' ? '⏳ En attente' : u.status === 'ACTIVE' ? '✅ Actif' : '❌ Bloqué'}
                                </span>
                            </div>
                            <div class="text-right">
                                ${u.status === 'PENDING' ? `
                                    <button onclick="validateUser('${u.id}', 'ACTIVE')" class="btn-success px-3 py-1 text-xs mr-1">
                                        <i class="fas fa-check"></i> Valider
                                    </button>
                                    <button onclick="validateUser('${u.id}', 'BLOCKED')" class="btn-danger px-3 py-1 text-xs">
                                        <i class="fas fa-times"></i> Rejeter
                                    </button>
                                ` : '<span class="text-xs text-gray-400">Déjà traité</span>'}
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement</p>';
                    console.error(err);
                });
        }

        // ============================================
        // VALIDER / REJETER UN UTILISATEUR (CORRIGÉ)
        // ============================================
        window.validateUser = function(id, status) {
            if (!confirm(`Voulez-vous vraiment ${status === 'ACTIVE' ? 'valider' : 'rejeter'} cet utilisateur ?`)) return;

            const btn = document.querySelector(`button[onclick="validateUser('${id}', '${status}')"]`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            }

            apiCall(`/api/admin/users/${id}/validate`, {
                method: 'PUT',
                body: JSON.stringify({ status })
            })
            .then(data => {
                if (data.success) {
                    alert(`✅ Utilisateur ${status === 'ACTIVE' ? 'validé' : 'rejeté'} avec succès !`);
                    loadUsers();
                } else {
                    alert('❌ Erreur: ' + (data.error || 'Problème lors de la validation'));
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = status === 'ACTIVE' ? '<i class="fas fa-check"></i> Valider' : '<i class="fas fa-times"></i> Rejeter';
                    }
                }
            })
            .catch(err => {
                alert('❌ Erreur de connexion au serveur');
                console.error(err);
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = status === 'ACTIVE' ? '<i class="fas fa-check"></i> Valider' : '<i class="fas fa-times"></i> Rejeter';
                }
            });
        };

        // ============================================
        // BÉNÉFICIAIRES (Admin)
        // ============================================
        function loadAdminBeneficiaries() {
            const list = document.getElementById('adminBeneficiariesList');
            list.innerHTML = '<div class="loading-spinner"></div>';

            apiCall('/api/admin/beneficiaries')
                .then(data => {
                    if (!data.beneficiaries || data.beneficiaries.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">Aucun bénéficiaire.</p>';
                        return;
                    }
                    list.innerHTML = data.beneficiaries.map(b => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl">
                            <div>
                                <p class="font-semibold text-dark">${b.name}</p>
                                <p class="text-sm text-gray-500 font-mono">${b.iban}</p>
                                <p class="text-xs text-gray-400">Utilisateur: ${b.first_name} ${b.last_name}</p>
                                <span class="${b.status === 'PENDING' ? 'status-pending' : b.status === 'ACTIVE' ? 'status-active' : 'status-rejected'}">
                                    ${b.status === 'PENDING' ? '⏳ En attente' : b.status === 'ACTIVE' ? '✅ Validé' : '❌ Rejeté'}
                                </span>
                                ${b.rejection_reason ? `<p class="text-xs text-red-500 mt-1">Motif: ${b.rejection_reason}</p>` : ''}
                            </div>
                            <div>
                                ${b.status === 'PENDING' ? `
                                    <button onclick="validateBeneficiary('${b.id}', 'ACTIVE')" class="btn-success px-3 py-1 text-xs mr-1">
                                        <i class="fas fa-check"></i> Valider
                                    </button>
                                    <button onclick="validateBeneficiary('${b.id}', 'REJECTED')" class="btn-danger px-3 py-1 text-xs">
                                        <i class="fas fa-times"></i> Rejeter
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement</p>';
                    console.error(err);
                });
        }

        window.validateBeneficiary = function(id, status) {
            const reason = status === 'REJECTED' ? prompt('Motif du rejet:') : null;
            if (status === 'REJECTED' && !reason) return;

            if (!confirm(`Valider ou rejeter ce bénéficiaire ?`)) return;

            apiCall(`/api/admin/beneficiaries/${id}/validate`, {
                method: 'PUT',
                body: JSON.stringify({ status, rejection_reason: reason })
            })
            .then(() => loadAdminBeneficiaries())
            .catch(err => alert('Erreur: ' + err.message));
        };

        // ============================================
        // VIREMENTS (Admin)
        // ============================================
        function loadAdminTransfers() {
            const list = document.getElementById('adminTransfersList');
            list.innerHTML = '<div class="loading-spinner"></div>';

            apiCall('/api/admin/transfers')
                .then(data => {
                    if (!data.transfers || data.transfers.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">Aucun virement en attente.</p>';
                        return;
                    }
                    list.innerHTML = data.transfers.map(t => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl">
                            <div>
                                <p class="font-semibold text-dark">${t.amount} €</p>
                                <p class="text-sm text-gray-500">Bénéficiaire: ${t.beneficiary_name}</p>
                                <p class="text-xs text-gray-400">Utilisateur: ${t.first_name} ${t.last_name}</p>
                                <p class="text-xs text-gray-400">${new Date(t.created_at).toLocaleDateString('fr-FR')}</p>
                            </div>
                            <div>
                                <button onclick="validateTransfer('${t.id}', 'COMPLETED')" class="btn-success px-3 py-1 text-xs mr-1">
                                    <i class="fas fa-check"></i> Valider
                                </button>
                                <button onclick="validateTransfer('${t.id}', 'REJECTED')" class="btn-danger px-3 py-1 text-xs">
                                    <i class="fas fa-times"></i> Rejeter
                                </button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement</p>';
                    console.error(err);
                });
        }

        window.validateTransfer = function(id, status) {
            const reason = status === 'REJECTED' ? prompt('Motif du rejet:') : null;
            if (status === 'REJECTED' && !reason) return;

            if (!confirm(`Valider ou rejeter ce virement ?`)) return;

            apiCall(`/api/admin/transfers/${id}/validate`, {
                method: 'PUT',
                body: JSON.stringify({ status, admin_comment: reason })
            })
            .then(() => loadAdminTransfers())
            .catch(err => alert('Erreur: ' + err.message));
        };

        // ============================================
        // ADRESSES (Admin)
        // ============================================
        function loadAddresses() {
            const list = document.getElementById('addressesList');
            list.innerHTML = '<div class="loading-spinner"></div>';

            apiCall('/api/admin/deposit-addresses')
                .then(data => {
                    if (!data.addresses || data.addresses.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">Aucune adresse configurée.</p>';
                        return;
                    }
                    const uniqueMap = {};
                    data.addresses.forEach(a => {
                        if (!uniqueMap[a.currency]) {
                            uniqueMap[a.currency] = a;
                        }
                    });
                    const uniqueAddresses = Object.values(uniqueMap);

                    list.innerHTML = uniqueAddresses.map(a => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl">
                            <div>
                                <p class="font-semibold text-dark">${a.currency}</p>
                                <p class="text-sm text-gray-500 font-mono">${a.address}</p>
                                <p class="text-xs text-gray-400">Réseau: ${a.network}</p>
                            </div>
                            <div>
                                <button onclick="editAddress('${a.id}')" class="btn-warning px-3 py-1 text-xs">
                                    <i class="fas fa-edit"></i> Modifier
                                </button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    list.innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement</p>';
                    console.error(err);
                });
        }

        window.editAddress = function(id) {
            const newAddress = prompt('Entrez la nouvelle adresse:');
            if (!newAddress) return;
            apiCall(`/api/admin/deposit-addresses/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ address: newAddress })
            })
            .then(() => loadAddresses());
        };
    </script>
</body>
</html>
