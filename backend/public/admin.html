<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warip Finance - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #111827; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .hover-bg-gold:hover { background: #d4a03a; }
    </style>
</head>
<body>
    <div id="admin-root"></div>

    <script>
        // ============================================
        // PAGE ADMIN COMPLETE (sans React)
        // ============================================
        (function() {
            'use strict';

            const API_URL = '';
            let currentUser = null;
            let users = [];

            // ========== ÉTAT ==========
            let state = {
                isLoggedIn: false,
                email: '',
                password: '',
                error: '',
                loading: false,
                users: [],
                selectedUser: null,
                adminComment: '',
                isLoadingUsers: false
            };

            // ========== RENDER ==========
            function render() {
                const root = document.getElementById('admin-root');
                if (!root) return;

                if (!state.isLoggedIn) {
                    root.innerHTML = renderLogin();
                    attachLoginEvents();
                } else {
                    root.innerHTML = renderDashboard();
                    attachDashboardEvents();
                }
            }

            // ========== LOGIN ==========
            function renderLogin() {
                return `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="bg-gray-800 p-8 rounded-2xl max-w-md w-full shadow-xl border border-gray-700">
                            <div class="text-center mb-8">
                                <div class="text-5xl mb-3">👑</div>
                                <h1 class="text-3xl font-bold gold">Accès Admin</h1>
                                <p class="text-gray-400 mt-2">Espace réservé au propriétaire</p>
                            </div>

                            ${state.error ? `<div class="bg-red-900/50 border border-red-500 text-red-300 p-3 rounded-lg mb-4 text-sm">${state.error}</div>` : ''}

                            <form id="admin-login-form" class="space-y-4">
                                <div>
                                    <label class="block text-gray-300 mb-2 text-sm font-medium">Email admin</label>
                                    <input type="email" id="admin-email" value="${state.email}" placeholder="admin@waripfinance.com" class="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500" required>
                                </div>
                                <div>
                                    <label class="block text-gray-300 mb-2 text-sm font-medium">Mot de passe admin</label>
                                    <input type="password" id="admin-password" value="${state.password}" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500" required>
                                </div>
                                <button type="submit" id="admin-login-btn" class="w-full py-3 rounded-lg font-semibold text-lg transition bg-gold text-gray-900 hover-bg-gold">
                                    ${state.loading ? '⏳ Connexion...' : '🔑 Se connecter'}
                                </button>
                            </form>
                            <p class="text-center text-gray-500 text-xs mt-6">Accès réservé au propriétaire</p>
                        </div>
                    </div>
                `;
            }

            function attachLoginEvents() {
                const form = document.getElementById('admin-login-form');
                if (form) {
                    form.addEventListener('submit', handleLogin);
                }
            }

            async function handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('admin-email').value;
                const password = document.getElementById('admin-password').value;

                state.loading = true;
                state.error = '';
                render();

                try {
                    const res = await fetch(`/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok || data.user?.role !== 'ADMIN') {
                        state.error = data.error || 'Accès refusé. Vous n\'êtes pas administrateur.';
                        state.loading = false;
                        render();
                        return;
                    }

                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    state.isLoggedIn = true;
                    state.loading = false;
                    currentUser = data.user;
                    render();
                    fetchUsers();

                } catch (err) {
                    state.error = 'Erreur de connexion au serveur';
                    state.loading = false;
                    render();
                }
            }

            // ========== DASHBOARD ==========
            function renderDashboard() {
                const userCount = state.users.length;
                return `
                    <div class="min-h-screen p-4 md:p-8">
                        <div class="max-w-6xl mx-auto">
                            <div class="flex justify-between items-center mb-8">
                                <div>
                                    <h1 class="text-3xl font-bold gold">👑 Administration</h1>
                                    <p class="text-gray-400">Gestion des utilisateurs inscrits</p>
                                </div>
                                <button id="admin-logout-btn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm">
                                    Déconnexion
                                </button>
                            </div>

                            <div class="bg-gray-800 p-4 rounded-2xl mb-6">
                                <p class="text-gray-400 text-sm">Utilisateurs en attente de validation</p>
                                <p class="text-3xl font-bold gold">${userCount}</p>
                            </div>

                            ${state.isLoadingUsers ? `
                                <div class="text-center text-gray-400 bg-gray-800 p-12 rounded-2xl">⏳ Chargement des utilisateurs...</div>
                            ` : userCount === 0 ? `
                                <div class="text-center text-gray-400 bg-gray-800 p-12 rounded-2xl">🎉 Aucun utilisateur en attente de validation</div>
                            ` : `
                                <div class="bg-gray-800 rounded-2xl overflow-hidden">
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-sm">
                                            <thead class="bg-gray-700">
                                                <tr>
                                                    <th class="px-4 py-3 text-left text-gray-300">Nom</th>
                                                    <th class="px-4 py-3 text-left text-gray-300">Email</th>
                                                    <th class="px-4 py-3 text-left text-gray-300">Téléphone</th>
                                                    <th class="px-4 py-3 text-left text-gray-300">Date</th>
                                                    <th class="px-4 py-3 text-left text-gray-300">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${state.users.map(user => `
                                                    <tr class="border-t border-gray-700 hover:bg-gray-700/50">
                                                        <td class="px-4 py-3 text-white">${user.first_name} ${user.last_name}</td>
                                                        <td class="px-4 py-3 text-gray-300">${user.email}</td>
                                                        <td class="px-4 py-3 text-gray-300">${user.phone}</td>
                                                        <td class="px-4 py-3 text-gray-400 text-sm">${new Date(user.created_at).toLocaleDateString('fr-FR')}</td>
                                                        <td class="px-4 py-3">
                                                            <button class="treat-btn px-3 py-1 bg-yellow-500/20 text-yellow-500 rounded-lg hover:bg-yellow-500/30 transition text-xs font-semibold" data-user='${JSON.stringify(user).replace(/'/g, "&#39;")}'>
                                                                🔍 Traiter
                                                            </button>
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="p-4 text-xs text-gray-500 border-t border-gray-700">
                                        Total : ${userCount} utilisateur${userCount > 1 ? 's' : ''} en attente
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                    ${state.selectedUser ? renderModal() : ''}
                `;
            }

            function renderModal() {
                const user = state.selectedUser;
                return `
                    <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                        <div class="bg-gray-800 rounded-2xl p-8 max-w-md w-full">
                            <h2 class="text-2xl font-bold gold mb-4">Traiter l'utilisateur</h2>
                            <div class="space-y-2 text-gray-300 mb-6 text-sm">
                                <p><strong>Nom :</strong> ${user.first_name} ${user.last_name}</p>
                                <p><strong>Email :</strong> ${user.email}</p>
                                <p><strong>Téléphone :</strong> ${user.phone}</p>
                                <p><strong>Inscription :</strong> ${new Date(user.created_at).toLocaleDateString('fr-FR')}</p>
                            </div>
                            <div class="mb-4">
                                <label class="block text-gray-300 mb-2 text-sm">Commentaire (optionnel)</label>
                                <textarea id="admin-comment" class="w-full px-4 py-3 bg-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500 resize-none" rows="3" placeholder="Motif du rejet...">${state.adminComment}</textarea>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button id="validate-btn" class="flex-1 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold">✅ Valider</button>
                                <button id="reject-btn" class="flex-1 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-semibold">❌ Rejeter</button>
                            </div>
                            <button id="modal-close-btn" class="w-full mt-4 py-2 text-gray-400 hover:text-white transition text-sm">Annuler</button>
                        </div>
                    </div>
                `;
            }

            function attachDashboardEvents() {
                const logoutBtn = document.getElementById('admin-logout-btn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', handleLogout);
                }

                // Traiter les boutons "Traiter"
                document.querySelectorAll('.treat-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        try {
                            state.selectedUser = JSON.parse(this.dataset.user);
                            state.adminComment = '';
                            render();
                            attachModalEvents();
                        } catch (e) {
                            console.error('Erreur parsing user:', e);
                        }
                    });
                });
            }

            function attachModalEvents() {
                const validateBtn = document.getElementById('validate-btn');
                const rejectBtn = document.getElementById('reject-btn');
                const closeBtn = document.getElementById('modal-close-btn');
                const comment = document.getElementById('admin-comment');

                if (validateBtn) {
                    validateBtn.addEventListener('click', () => {
                        state.adminComment = comment ? comment.value : '';
                        handleValidate(state.selectedUser.id, 'ACTIVE');
                    });
                }
                if (rejectBtn) {
                    rejectBtn.addEventListener('click', () => {
                        state.adminComment = comment ? comment.value : '';
                        handleValidate(state.selectedUser.id, 'BLOCKED');
                    });
                }
                if (closeBtn) {
                    closeBtn.addEventListener('click', () => {
                        state.selectedUser = null;
                        state.adminComment = '';
                        render();
                        attachDashboardEvents();
                    });
                }
            }

            // ========== API ==========
            async function fetchUsers() {
                state.isLoadingUsers = true;
                render();

                try {
                    const token = localStorage.getItem('admin_token');
                    const res = await fetch(`/api/admin/users/pending`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error('Erreur chargement');
                    const data = await res.json();
                    state.users = data.users || [];
                } catch (error) {
                    console.error('Erreur:', error);
                    state.users = [];
                } finally {
                    state.isLoadingUsers = false;
                    render();
                    attachDashboardEvents();
                }
            }

            async function handleValidate(userId, status) {
                try {
                    const token = localStorage.getItem('admin_token');
                    await fetch(`/api/admin/users/${userId}/validate`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ status, admin_comment: state.adminComment || '' })
                    });
                    state.selectedUser = null;
                    state.adminComment = '';
                    fetchUsers();
                } catch (error) {
                    console.error('Erreur validation:', error);
                    alert('Erreur lors de la validation');
                }
            }

            function handleLogout() {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_user');
                state.isLoggedIn = false;
                state.users = [];
                state.selectedUser = null;
                render();
            }

            // ========== INIT ==========
            function init() {
                const token = localStorage.getItem('admin_token');
                const user = JSON.parse(localStorage.getItem('admin_user') || '{}');
                if (token && user.role === 'ADMIN') {
                    state.isLoggedIn = true;
                    currentUser = user;
                    render();
                    fetchUsers();
                } else {
                    render();
                }
            }

            init();
        })();
    </script>
</body>
</html>
