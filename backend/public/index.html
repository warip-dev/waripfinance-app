<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .hover-bg-gold:hover { background: #d4a03a; }
        .text-dark { color: #1a1a2e; }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-primary:hover { background: #d4a03a; }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        .input-focus:focus { border-color: #e9b64a; box-shadow: 0 0 0 3px rgba(233, 182, 74, 0.2); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <span class="text-2xl font-bold text-dark"><span class="gold">Warip</span> Finance</span>
                <button id="openLoginModal" class="btn-primary"><i class="fas fa-user mr-2"></i>Se connecter</button>
            </div>
        </div>
    </header>

    <!-- MODAL -->
    <div id="authModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 relative">
            <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            <div id="loginForm">
                <h2 class="text-2xl font-bold text-dark mb-2">Connexion</h2>
                <div id="loginError" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-lg mb-4"></div>
                <form id="loginFormSubmit">
                    <div class="mb-4">
                        <input type="email" id="loginEmail" placeholder="Email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                    </div>
                    <div class="mb-4">
                        <input type="password" id="loginPassword" placeholder="Mot de passe" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                    </div>
                    <div class="flex justify-between items-center mb-6">
                        <a href="/forgot-password.html" class="text-sm text-gold hover:underline">Mot de passe oublié ?</a>
                    </div>
                    <button type="submit" class="w-full btn-primary py-3 text-lg">Se connecter</button>
                </form>
                <p class="text-center text-gray-500 text-sm mt-4">
                    Pas encore de compte ?
                    <button id="showRegister" class="text-gold font-semibold hover:underline">Créer un compte</button>
                </p>
            </div>
            <div id="registerForm" class="hidden">
                <h2 class="text-2xl font-bold text-dark mb-2">Créer un compte</h2>
                <div id="registerError" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-lg mb-4"></div>
                <form id="registerFormSubmit">
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <input type="text" id="regFirstName" placeholder="Prénom" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                        <input type="text" id="regLastName" placeholder="Nom" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" id="regEmail" placeholder="Email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" id="regPassword" placeholder="Mot de passe (min 8 caractères)" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required minlength="8">
                    </div>
                    <button type="submit" class="w-full btn-primary py-3 text-lg">Créer mon compte</button>
                </form>
                <p class="text-center text-gray-500 text-sm mt-4">
                    Déjà un compte ?
                    <button id="showLogin" class="text-gold font-semibold hover:underline">Se connecter</button>
                </p>
            </div>
        </div>
    </div>

    <!-- HERO -->
    <section class="pt-32 pb-16 bg-gradient-to-r from-gray-50 to-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-dark">La banque qui <span class="gold">réinvente</span> votre argent</h1>
            <p class="text-gray-600 text-lg mt-4 max-w-2xl mx-auto">Ouvrez un compte en 5 minutes, gérez vos cryptos et vos euros en toute simplicité.</p>
            <button id="heroOpenRegister" class="btn-primary px-8 py-4 text-lg mt-6"><i class="fas fa-rocket mr-2"></i>Ouvrir un compte</button>
        </div>
    </section>

    <footer class="bg-dark text-gray-400 py-8 text-center text-sm">
        &copy; 2025 Warip Finance. Tous droits réservés.
    </footer>

    <script>
        const modal = document.getElementById('authModal');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginError = document.getElementById('loginError');
        const registerError = document.getElementById('registerError');

        document.getElementById('openLoginModal').addEventListener('click', () => { modal.classList.remove('hidden'); });
        document.getElementById('heroOpenRegister').addEventListener('click', () => { modal.classList.remove('hidden'); showRegister(); });
        document.getElementById('closeModal').addEventListener('click', () => { modal.classList.add('hidden'); });
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });

        function showLogin() { loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); loginError.classList.add('hidden'); }
        function showRegister() { loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); registerError.classList.add('hidden'); }
        document.getElementById('showRegister').addEventListener('click', showRegister);
        document.getElementById('showLogin').addEventListener('click', showLogin);

        document.getElementById('loginFormSubmit').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            loginError.classList.add('hidden');
            try {
                const res = await fetch('https://waripfinance.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) { loginError.textContent = data.error || 'Erreur'; loginError.classList.remove('hidden'); return; }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = data.user.role === 'ADMIN' ? '/admin/' : '/dashboard';
            } catch (err) {
                loginError.textContent = 'Erreur de connexion au serveur';
                loginError.classList.remove('hidden');
            }
        });

        document.getElementById('registerFormSubmit').addEventListener('submit', async function(e) {
            e.preventDefault();
            const first_name = document.getElementById('regFirstName').value;
            const last_name = document.getElementById('regLastName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            registerError.classList.add('hidden');
            if (password.length < 8) {
                registerError.textContent = 'Le mot de passe doit contenir au moins 8 caractères';
                registerError.classList.remove('hidden');
                return;
            }
            try {
                const res = await fetch('https://waripfinance.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ first_name, last_name, email, password, country: 'FR' })
                });
                const data = await res.json();
                if (!res.ok) { registerError.textContent = data.error || 'Erreur'; registerError.classList.remove('hidden'); return; }
                window.location.href = '/pending';
            } catch (err) {
                registerError.textContent = 'Erreur de connexion au serveur';
                registerError.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
