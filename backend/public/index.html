<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Warip Finance - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">🏦 Warip Finance</h1>

            <div id="error" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Mot de passe</label>
                    <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" required>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-yellow-500 text-gray-900 font-semibold py-3 rounded-lg hover:bg-yellow-400 transition">
                    Se connecter
                </button>
            </form>

            <p class="text-center text-gray-500 text-sm mt-4">
                Pas encore de compte ? <a href="/register" class="text-yellow-600 hover:underline">Créer un compte</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('loginBtn');

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Connexion...';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = 'Se connecter';

                if (!data.success) {
                    errorEl.textContent = data.error || 'Email ou mot de passe incorrect';
                    errorEl.classList.remove('hidden');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // REDIRECTION
                if (data.user.role === 'ADMIN') {
                    window.location.href = '/admin.html';
                } else if (data.user.status === 'PENDING') {
                    window.location.href = '/pending.html';
                } else {
                    window.location.href = '/dashboard.html';
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = 'Se connecter';
                errorEl.textContent = 'Erreur de connexion au serveur';
                errorEl.classList.remove('hidden');
            });
        });
    </script>

</body>
</html>
