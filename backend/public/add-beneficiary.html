<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ajouter un bénéficiaire - Warip Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f0f2f5; }
        .gold { color: #e9b64a; }
        .bg-gold { background: #e9b64a; }
        .text-dark { color: #1a1a2e; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .btn-primary { background: #e9b64a; color: #1a1a2e; font-weight: 600; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; font-size: 14px; transition: all 0.3s; display: inline-block; text-align: center; text-decoration: none; }
        .btn-primary:hover { background: #d4a03a; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 182, 74, 0.3); }
        .gradient-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .input-focus:focus { border-color: #e9b64a; box-shadow: 0 0 0 3px rgba(233, 182, 74, 0.2); }
    </style>
</head>
<body>

    <header class="gradient-header fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="text-white font-bold text-xl"><span class="gold">Warip</span> Finance</a>
                <a href="/beneficiary.html" class="text-white hover:text-gray-300"><i class="fas fa-arrow-left mr-2"></i>Retour</a>
            </div>
        </div>
    </header>

    <div class="pt-24 pb-8 px-4 md:px-8 max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl p-8 card-shadow">
            <h1 class="text-2xl font-bold text-dark mb-2">➕ Ajouter un bénéficiaire</h1>
            <p class="text-gray-500 text-sm mb-6">Le bénéficiaire sera soumis à validation par notre équipe (délai 24h).</p>

            <div id="message" class="text-sm mb-4"></div>

            <form id="addBeneficiaryForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom du bénéficiaire</label>
                    <input type="text" id="beneficiaryName" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">IBAN</label>
                    <input type="text" id="beneficiaryIban" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">BIC (optionnel)</label>
                    <input type="text" id="beneficiaryBic" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus">
                </div>
                <button type="submit" id="submitBtn" class="w-full btn-primary py-3 text-lg">
                    <i class="fas fa-save mr-2"></i>Enregistrer le bénéficiaire
                </button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        document.getElementById('addBeneficiaryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            const name = document.getElementById('beneficiaryName').value;
            const iban = document.getElementById('beneficiaryIban').value;
            const bic = document.getElementById('beneficiaryBic').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Envoi...';

            fetch('/api/beneficiaries', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, iban, bic })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.innerHTML = '<span class="text-green-500">✅ Bénéficiaire ajouté, en attente de validation (24h).</span>';
                    document.getElementById('addBeneficiaryForm').reset();
                    setTimeout(() => { window.location.href = '/beneficiary.html'; }, 2000);
                } else {
                    msg.innerHTML = '<span class="text-red-500">' + (data.error || 'Erreur') + '</span>';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save mr-2"></i>Enregistrer le bénéficiaire';
                }
            })
            .catch(() => {
                msg.innerHTML = '<span class="text-red-500">Erreur de connexion au serveur</span>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-2"></i>Enregistrer le bénéficiaire';
            });
        });
    </script>
</body>
</html>
