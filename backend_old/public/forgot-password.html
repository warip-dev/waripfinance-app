<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warip Finance - Mot de passe oublié</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #eef1f5;
        }
        .logo { font-size: 28px; font-weight: 800; color: #1e2a3a; text-align: center; margin-bottom: 4px; }
        .logo span { background: #ffd600; padding: 2px 12px; border-radius: 30px; }
        .subtitle { text-align: center; color: #7a869a; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: #1e2a3a; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eef1f5;
            border-radius: 60px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            transition: border 0.2s;
            outline: none;
        }
        .form-group input:focus { border-color: #ffd600; background: white; }
        .btn {
            width: 100%;
            padding: 16px;
            background: #ffd600;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            color: #1e2a3a;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #f5c800; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 14px; color: #7a869a; text-decoration: none; }
        .back-link:hover { color: #1e2a3a; }
        .error-message {
            background: #fff5f5; color: #e74c3c; padding: 12px 16px;
            border-radius: 12px; font-size: 14px; margin-bottom: 16px; display: none;
        }
        .success-message {
            background: #e8f8f6; color: #00b8a9; padding: 12px 16px;
            border-radius: 12px; font-size: 14px; margin-bottom: 16px; display: none;
        }
        .password-hint { font-size: 12px; color: #7a869a; margin-top: 4px; padding-left: 4px; }
        .password-hint.valid { color: #00b8a9; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo"><span>W</span>arip Finance</div>
        <div class="subtitle">Réinitialiser votre mot de passe</div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="forgotForm" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="jean.dupont@email.com" required>
            </div>

            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" id="newPassword" placeholder="••••••••" minlength="6" required>
                <div class="password-hint" id="passwordHint">Minimum 6 caractères</div>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" id="resetBtn">Réinitialiser le mot de passe</button>
        </form>

        <a href="login.html" class="back-link">← Retour à la connexion</a>
    </div>

    <script>
        document.getElementById('newPassword').addEventListener('input', function() {
            const hint = document.getElementById('passwordHint');
            if (this.value.length >= 6) {
                hint.textContent = '✅ Mot de passe valide';
                hint.className = 'password-hint valid';
            } else {
                hint.textContent = 'Minimum 6 caractères';
                hint.className = 'password-hint';
            }
        });

        async function handleForgotPassword(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const btn = document.getElementById('resetBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = '❌ Les mots de passe ne correspondent pas';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = '❌ Le mot de passe doit faire au moins 6 caractères';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ En cours...';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = '✅ ' + data.message + ' Redirection...';
                    successDiv.style.display = 'block';
                    btn.textContent = '✅ Réinitialisé !';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = '❌ ' + data.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Réinitialiser le mot de passe';
                }

            } catch (error) {
                console.error('Erreur:', error);
                errorDiv.textContent = '❌ Erreur de connexion au serveur';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Réinitialiser le mot de passe';
            }
        }
    </script>

</body>
</html>
